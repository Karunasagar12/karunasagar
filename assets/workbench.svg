<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
<title id="title">Karuna Sagar — Builder, founder, systems thinker</title>
<desc id="desc">Dark terminal window with cyan and green accents. Exploring AI agents, memory, evaluation, and healthcare.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c2938" stroke-width="0.6"/></pattern>
  <linearGradient id="accent"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
</defs>
<rect width="1000" height="310" rx="16" fill="#0b1018"/>
<rect width="1000" height="310" rx="16" fill="url(#grid)"/>
<rect x="20" y="20" width="960" height="270" rx="12" fill="#0d1420" stroke="#293548"/>
<path d="M32 20 H968 Q980 20 980 32 V64 H20 V32 Q20 20 32 20" fill="#172130"/>
<circle cx="44" cy="42" r="5" fill="#fb7185"/><circle cx="64" cy="42" r="5" fill="#fbbf24"/><circle cx="84" cy="42" r="5" fill="#a3e635"/>
<g font-family="monospace">
<text x="500" y="47" text-anchor="middle" font-size="12" fill="#a4b4c8">karuna@workbench: ~/building</text>
<text x="52" y="101" font-size="15" fill="#a3e635">$ whoami</text>
<text x="50" y="151" font-size="42" font-weight="700" fill="#f0f6fc">Karuna Sagar<tspan fill="#67e8f9">_</tspan></text>
<text x="52" y="183" font-size="16" fill="#bac9da">Builder. Founder. Systems thinker.</text>
<rect x="52" y="206" width="64" height="3" rx="1.5" fill="url(#accent)"/>
<text x="52" y="242" font-size="14" fill="#67e8f9">AI agents <tspan fill="#52657e">/</tspan> memory <tspan fill="#52657e">/</tspan> evals <tspan fill="#52657e">/</tspan> healthcare</text>
<text x="52" y="267" font-size="12" fill="#8294ad">Curiosity is the input. Working software is the output.</text>
</g></svg>